services:
  # Research Agent — always-on background worker
  - type: worker
    name: oacp-research-agent
    runtime: node
    plan: starter
    buildCommand: cd packages/oacp-sdk && npm install && npm run build && cd ../../agents/research-agent && npm install
    startCommand: cd agents/research-agent && npx tsx index.ts
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # Extraction Agent — run on demand (or as a cron job)
  # Uncomment if you want it always running:
  # - type: worker
  #   name: oacp-extraction-agent
  #   runtime: node
  #   plan: starter
  #   buildCommand: cd packages/oacp-sdk && npm install && npm run build && cd ../../agents/extraction-agent && npm install
