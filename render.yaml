services:
  # Fleet Host — every resident agent in one process (protocol expert first).
  # Identities derive from FLEET_MASTER_SEED (32 bytes hex) — one secret pins
  # the whole fleet; adding a resident is a roster entry, not a new service.
  #
  # The old one-worker-per-agent services (concierge, code-review, translator,
  # scribe, pr-review) are retired: new always-on agents belong in the fleet
  # roster (agents/fleet-host/src/roster.ts), not in this file.
  - type: worker
    name: oacp-fleet-host
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: cd agents/fleet-host && node --import tsx index.ts
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # 32 bytes as 64 hex chars; generate once:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: FLEET_MASTER_SEED
        sync: false
      # Optional: agent IDs every resident accepts as senders at boot,
      # comma-separated (agents/fleet-host/src/accept-senders.ts).
      - key: FLEET_ACCEPT_SENDERS
        sync: false
      # Optional: the daily brainstorm between network-ideator and
      # network-builder (agents/fleet-host/src/residents/brainstorm.ts).
      # It stays off until both of these are set. The token should be limited
      # to Issues (read and write) on that one repository.
      - key: BRAINSTORM_GITHUB_REPO
        sync: false
      - key: BRAINSTORM_GITHUB_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
